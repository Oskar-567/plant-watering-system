name: Firmware CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test (native)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      # The example holds placeholder credentials only and every define the
      # firmware needs -- a hand-written stub here drifted out of sync.
      - name: Create CI config.h from example
        run: cp firmware/include/config.h.example firmware/include/config.h

      - name: Compile for ESP32
        working-directory: firmware
        run: pio run -e esp32dev

      - name: Run native unit tests
        working-directory: firmware
        run: pio test -e native
