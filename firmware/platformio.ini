[platformio]
; wildcard so this stays optional -- e.g. env:native builds/tests work
; on a fresh clone before platformio_override.ini has been created
extra_configs = platformio_override*.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = espota
; upload_port is machine-specific (LAN IP of the ESP32) -- set it in
; platformio_override.ini (gitignored), see platformio_override.ini.example
lib_deps =
    knolleary/PubSubClient@^2.8
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4

[env:native]
platform = native
test_build_src = no
