spring.application.name=plant-watering-server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/plantdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Resource limits for the Raspberry Pi
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT — 30-day expiry
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=2592000000

# Single-user auth
app.password=${APP_PASSWORD}

# MQTT
mqtt.broker=${MQTT_BROKER}
mqtt.port=${MQTT_PORT:1883}
mqtt.client-id=plant-server
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.enabled=${MQTT_ENABLED:true}

# SpringDoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
